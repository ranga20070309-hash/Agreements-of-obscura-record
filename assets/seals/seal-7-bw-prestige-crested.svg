      <line x1="200" y1="234" x2="200" y2="288" stroke-width="1.2" transform="rotate(-18 200 200)" />
      <line x1="200" y1="234" x2="200" y2="288" stroke-width="2" transform="rotate(-24 200 200)" />
      <line x1="200" y1="234" x2="200" y2="288" stroke-width="1.2" transform="rotate(-30 200 200)" />
      <line x1="200" y1="234" x2="200" y2="288" stroke-width="2" transform="rotate(-36 200 200)" />
      <line x1="200" y1="234" x2="200" y2="288" stroke-width="1.2" transform="rotate(-42 200 200)" />
      <line x1="200" y1="234" x2="200" y2="288" stroke-width="2" transform="rotate(-48 200 200)" />
      <line x1="200" y1="234" x2="200" y2="288" stroke-width="1.2" transform="rotate(-54 200 200)" />
