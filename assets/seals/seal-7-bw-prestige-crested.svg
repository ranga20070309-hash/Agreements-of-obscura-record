<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Text Paths -->
    <path id="prOuterUpper" d="M 36 200 A 164 164 0 1 1 364 200" fill="none" />
    <path id="prOuterLower" d="M 364 200 A 164 164 0 0 1 36 200" fill="none" />
    <path id="prInnerUpper" d="M 72 200 A 128 128 0 1 1 328 200" fill="none" />
