<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Text Paths -->
    <path id="geoOuterUpper" d="M 40 200 A 160 160 0 1 1 360 200" fill="none" />
    <path id="geoOuterLower" d="M 360 200 A 160 160 0 0 1 40 200" fill="none" />
    <path id="geoInnerUpper" d="M 76 200 A 124 124 0 1 1 324 200" fill="none" />
    <path id="geoInnerLower" d="M 324 200 A 124 124 0 0 1 76 200" fill="none" />
  </defs>

  <style>
    .geo-text {
      fill: #000000;
      font-family: 'Inter', -apple-system, sans-serif;
    }
  </style>

  <g>
    <!-- Outer Precision Ring -->
    <circle cx="200" cy="200" r="186" fill="none" stroke="#000000" stroke-width="1.5" />
    <!-- Segmented Tech Ring -->
    <circle cx="200" cy="200" r="178" fill="none" stroke="#000000" stroke-width="4" stroke-dasharray="12 4 4 4" />

    <!-- Intermediate Separation Ring -->
    <circle cx="200" cy="200" r="142" fill="none" stroke="#000000" stroke-width="2" />
    <circle cx="200" cy="200" r="106" fill="none" stroke="#000000" stroke-width="1.5" />

    <!-- Center Geometric Vinyl Grooves & Spokes -->
    <circle cx="200" cy="200" r="72" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="2 3" />
    <circle cx="200" cy="200" r="48" fill="none" stroke="#000000" stroke-width="1" />

    <!-- Spoke Rays (Top) -->
    <g stroke="#000000">
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="2.2" />
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="1.2" transform="rotate(8 200 200)" />
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="2.2" transform="rotate(16 200 200)" />
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="1.2" transform="rotate(24 200 200)" />
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="2.2" transform="rotate(32 200 200)" />
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="1.2" transform="rotate(40 200 200)" />
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="2.2" transform="rotate(48 200 200)" />
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="1.2" transform="rotate(56 200 200)" />

      <!-- Left -->
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="1.2" transform="rotate(-8 200 200)" />
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="2.2" transform="rotate(-16 200 200)" />
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="1.2" transform="rotate(-24 200 200)" />
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="2.2" transform="rotate(-32 200 200)" />
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="1.2" transform="rotate(-40 200 200)" />
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="2.2" transform="rotate(-48 200 200)" />
      <line x1="200" y1="164" x2="200" y2="108" stroke-width="1.2" transform="rotate(-56 200 200)" />
    </g>

    <!-- Spoke Rays (Bottom) -->
    <g stroke="#000000">
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="2.2" />
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="1.2" transform="rotate(8 200 200)" />
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="2.2" transform="rotate(16 200 200)" />
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="1.2" transform="rotate(24 200 200)" />
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="2.2" transform="rotate(32 200 200)" />
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="1.2" transform="rotate(40 200 200)" />
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="2.2" transform="rotate(48 200 200)" />
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="1.2" transform="rotate(56 200 200)" />

      <!-- Left -->
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="1.2" transform="rotate(-8 200 200)" />
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="2.2" transform="rotate(-16 200 200)" />
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="1.2" transform="rotate(-24 200 200)" />
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="2.2" transform="rotate(-32 200 200)" />
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="1.2" transform="rotate(-40 200 200)" />
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="2.2" transform="rotate(-48 200 200)" />
      <line x1="200" y1="236" x2="200" y2="292" stroke-width="1.2" transform="rotate(-56 200 200)" />
    </g>

    <!-- Circular Track Inscriptions (LK & EST. 2024 - 2027 on perimeter) -->
    <text class="geo-text" font-size="11.5" font-weight="900" letter-spacing="3.5">
      <textPath href="#geoOuterUpper" startOffset="50%" text-anchor="middle">
        OBSCURA REC LLC • ARCHIVE MASTER
      </textPath>
    </text>

    <text class="geo-text" font-size="10.5" font-weight="800" letter-spacing="2.5">
      <textPath href="#geoOuterLower" startOffset="50%" text-anchor="middle">
        ★ EST. 2024 - 2027 • CERTIFIED RELEASE ★
      </textPath>
    </text>

    <text class="geo-text" font-size="10" font-weight="800" letter-spacing="2">
      <textPath href="#geoInnerUpper" startOffset="50%" text-anchor="middle">
        LIMITED LIABILITY COMPANY
      </textPath>
    </text>

    <text class="geo-text" font-size="9.5" font-weight="800" letter-spacing="2">
      <textPath href="#geoInnerLower" startOffset="50%" text-anchor="middle">
        GLOBAL SOUND CATALOGUE • LK
      </textPath>
    </text>

    <!-- Left & Right Crosshair Dots -->
    <circle cx="34" cy="200" r="3.5" fill="#000000" />
    <circle cx="366" cy="200" r="3.5" fill="#000000" />

    <!-- Center Typography (NO LK in Center) -->
    <g text-anchor="middle">
      <text x="200" y="193" fill="#000000" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="3">
        OBSCURA
      </text>
      <text x="200" y="213" fill="#000000" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="4">
        RECORDS
      </text>

      <line x1="120" y1="223" x2="280" y2="223" stroke="#000000" stroke-width="2" />
      <rect x="194" y="221" width="12" height="4" fill="#000000" />
    </g>

  </g>
</svg>
